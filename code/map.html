<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Canadian Census Viewer</title>
    <script>try { var t = localStorage.getItem("cv-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            height: 100vh;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font: 14px/1.45 Inter, system-ui, sans-serif;
        }

        a { color: inherit; }
        button { font: inherit; color: inherit; cursor: pointer; }
        .mono { font-family: "JetBrains Mono", ui-monospace, monospace; }
        .muted { color: var(--muted); }
        .error { color: var(--down); }
        [hidden] { display: none !important; }
        :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        #map { position: fixed; inset: 0; background: var(--bg); }
        .leaflet-container { font: inherit; }

        .card {
            position: fixed;
            z-index: 1000;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            backdrop-filter: blur(8px);
            box-shadow: 0 12px 32px rgba(0, 0, 0, .35);
        }

        .control {
            top: 24px;
            left: 24px;
            width: 360px;
            max-height: calc(100vh - 120px);
            overflow-y: auto;
            padding: 22px 24px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .logo { display: flex; align-items: center; gap: 10px; font-weight: 600; text-decoration: none; }
        .logo-mark {
            display: grid;
            place-items: center;
            width: 24px;
            height: 24px;
            border-radius: 6px;
            background: var(--accent);
            color: #1a0d05;
            font-size: 12px;
            font-weight: 700;
        }

        .logo { white-space: nowrap; }
        .region-select { width: auto; max-width: 170px; min-width: 0; padding: 4px 8px; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }

        .search { width: 100%; padding: 9px 10px; font: inherit; color: var(--text); background: var(--raised); border: 1px solid var(--line); border-radius: 8px; }
        .search::placeholder { color: var(--muted); }

        .collapse-button { display: none; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--raised); font-size: 13px; }

        h1 {
            font: 700 28px/1.12 "Space Grotesk", Inter, sans-serif;
            letter-spacing: -.01em;
        }
        .intro { margin-top: 10px; color: var(--muted); }

        .eyebrow {
            display: block;
            margin-bottom: 8px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .segments { display: flex; padding: 3px; border-radius: 10px; background: var(--raised); }
        .segment {
            flex: 1;
            padding: 7px 0;
            border: 0;
            border-radius: 8px;
            background: none;
            color: var(--muted);
            font-weight: 500;
        }
        .segment[aria-pressed="true"] { background: var(--text); color: var(--bg); }

        select {
            width: 100%;
            padding: 9px 10px;
            font: inherit;
            color: var(--text);
            background: var(--raised);
            border: 1px solid var(--line);
            border-radius: 8px;
        }

        .legend { margin-top: 16px; }
        .legend-row { display: flex; align-items: center; gap: 10px; margin: 5px 0; }
        .legend-swatch { width: 18px; height: 12px; border-radius: 3px; flex-shrink: 0; }
        .dot-row .legend-swatch { width: 11px; height: 11px; border-radius: 50%; }

        .chips-heading { margin-top: 16px; }
        .chips { display: flex; flex-wrap: wrap; gap: 8px; }
        .chip {
            padding: 5px 12px;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: var(--raised);
            color: var(--muted);
        }
        .chip[aria-pressed="true"] { background: var(--text); border-color: var(--text); color: var(--bg); }

        .statusbar {
            bottom: 24px;
            left: 24px;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 8px 14px;
            font-size: 13px;
            color: var(--muted);
        }
        .timeline { display: flex; gap: 4px; }
        .year-button {
            padding: 3px 10px;
            border: 1px solid transparent;
            border-radius: 6px;
            background: none;
            color: var(--muted);
            font-family: "JetBrains Mono", monospace;
            font-size: 12px;
        }
        .year-button[aria-pressed="true"] { border-color: var(--accent); color: var(--text); }
        .year-button:disabled { opacity: .3; cursor: not-allowed; }
        .statusbar .sep { width: 1px; height: 16px; background: var(--line); }

        .leaflet-top.leaflet-right { top: 12px; right: 12px; }
        .leaflet-bar { border: 1px solid var(--line) !important; border-radius: 12px !important; overflow: hidden; background: var(--card); }
        .leaflet-bar a, .leaflet-bar a:hover {
            width: 38px !important;
            height: 38px !important;
            line-height: 38px !important;
            background: var(--card);
            color: var(--text);
            border-bottom-color: var(--line);
        }
        .leaflet-control-attribution { background: var(--card) !important; color: var(--muted); }
        .leaflet-control-attribution a { color: var(--muted); }

        .map-tip {
            padding: 6px 10px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--card);
            color: var(--text);
            box-shadow: none;
            font: inherit;
        }
        .map-tip::before { display: none; }
        .map-tip div { display: flex; flex-direction: column; }
        .map-tip span { color: var(--muted); font-family: "JetBrains Mono", monospace; font-size: 12px; }

        .drawer {
            top: 24px;
            right: 72px;
            bottom: 24px;
            width: 420px;
            overflow-y: auto;
            padding: 20px 22px 28px;
        }
        .drawer-head { display: flex; justify-content: space-between; align-items: center; }
        .crumbs { font-size: 12px; color: var(--muted); }
        .icon-button {
            width: 30px;
            height: 30px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--raised);
            font-size: 18px;
            line-height: 1;
        }
        .place-name { margin-top: 6px; font: 700 34px/1.1 "Space Grotesk", Inter, sans-serif; }
        .summary { margin: 14px 0 18px; font-size: 15px; line-height: 1.6; }
        .summary strong { color: var(--accent); font-weight: 600; }

        .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .stat { padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--raised); }
        .stat-label { display: block; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
        .stat-value { display: block; margin: 4px 0; font-size: 22px; }
        .stat.up .stat-value { color: var(--up); }
        .stat.down .stat-value { color: var(--down); }
        .stat-note { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }

        .badge {
            padding: 1px 6px;
            border-radius: 4px;
            background: var(--line);
            color: var(--text);
            font: 500 11px "JetBrains Mono", monospace;
        }
        .badge.high { background: rgba(249, 122, 60, .2); color: var(--accent); }
        .badge.low { background: rgba(79, 176, 232, .18); color: #7cc4ee; }

        .box { margin-top: 12px; padding: 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--raised); }
        .box-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; font-size: 12px; }
        .box-head h3 { font-size: 14px; font-weight: 600; }
        .key { display: flex; gap: 12px; font-size: 12px; color: var(--muted); }
        .key span::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 5px; border-radius: 50%; }
        .key-own::before { background: var(--accent); }
        .key-region::before { background: var(--region); }
        .box > .key { margin-top: 6px; }

        .chart { width: 100%; height: auto; }
        .chart text { fill: var(--muted); font: 10px "JetBrains Mono", monospace; }
        .chart .baseline { stroke: var(--line); stroke-dasharray: 3 3; }
        .chart circle.series-own { fill: var(--accent); }
        .chart circle.series-region { fill: var(--region); }
        .chart polyline { fill: none; stroke-width: 2; }
        .chart polyline.series-own { stroke: var(--accent); }
        .chart polyline.series-region { stroke: var(--region); }

        .bar-row { display: grid; grid-template-columns: 48px 1fr 108px; align-items: center; gap: 10px; margin: 8px 0; font-size: 13px; }
        .bars { display: flex; flex-direction: column; gap: 3px; }
        .bar { height: 6px; border-radius: 3px; min-width: 2px; }
        .bar-own { background: var(--accent); }
        .bar-region { background: var(--region); }
        .bar-nums { font-size: 12px; color: var(--muted); text-align: right; }
        .bar-nums strong { color: var(--text); font-weight: 500; }

        .theme { margin-top: 22px; }
        .theme-item {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 2px 12px;
            padding: 8px 0;
            border-bottom: 1px solid var(--line);
        }
        .theme-item dt { color: var(--muted); }
        .theme-item dd { text-align: right; }
        .theme-region { font-size: 12px; color: var(--muted); }
        .theme-item .badge { justify-self: end; align-self: center; }
        .theme-item.active dt, .theme-item.active dd { color: var(--accent); }

        .similar { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
        .similar-open { flex: 1; display: flex; flex-direction: column; padding: 2px 0; border: 0; background: none; text-align: left; }
        .similar-open:hover strong { color: var(--accent); }
        .pill-button { padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--raised); font-size: 12px; white-space: nowrap; }
        .pill-button:hover { border-color: var(--compare); }
        .compare-banner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-top: 12px;
            padding: 8px 12px;
            border: 1px solid var(--compare);
            border-radius: 10px;
            color: var(--compare);
            font-weight: 500;
        }
        .place-name:focus { outline: none; }
        .theme-toggle { font-size: 18px; text-decoration: none; }

        @media (max-width: 700px) {
            .control { top: 12px; left: 12px; right: 12px; width: auto; max-height: 46vh; padding: 16px; gap: 14px; }
            .collapse-button { display: block; }
            body.collapsed .control > :not(.brand):not(.headline-block) { display: none; }
            body.collapsed .intro { display: none; }
            h1 { font-size: 22px; }
            .statusbar { left: 12px; right: 12px; bottom: 12px; flex-wrap: wrap; }
            .statusbar .sep, .statusbar .source { display: none; }
            .drawer { inset: 12px; width: auto; }
            .leaflet-top.leaflet-right { top: auto; bottom: 70px; }
        }
    </style>
</head>
<body>
    <main id="map" aria-label="Map of census divisions"></main>

    <aside class="card control" aria-label="Map controls">
        <div class="brand">
            <a class="logo" href="main.html"><span class="logo-mark" aria-hidden="true">C</span>Census Viewer</a>
            <select class="region-select" id="region" aria-label="Region"></select>
        </div>
        <div class="headline-block">
            <h1 id="headline">Census divisions</h1>
            <p class="intro" id="intro"></p>
            <button class="collapse-button" id="collapse" type="button" aria-expanded="true" style="margin-top: 10px">Hide controls</button>
        </div>
        <div>
            <label class="eyebrow" for="search">Find a census division</label>
            <input class="search" id="search" list="search-list" placeholder="Type a name, e.g. Toronto" autocomplete="off">
            <datalist id="search-list"></datalist>
        </div>
        <div class="segments" id="view-toggle" role="group" aria-label="Map view"></div>
        <div id="map-controls">
            <label class="eyebrow" for="metric">Metric</label>
            <select id="metric"></select>
            <section class="legend" id="legend" aria-live="polite"></section>
        </div>
        <div id="dot-controls" hidden>
            <section id="dot-legend" aria-live="polite"></section>
            <h2 class="eyebrow chips-heading">Colour dots by</h2>
            <div class="chips" id="chips" role="group" aria-label="Colour dots by"></div>
        </div>
    </aside>

    <div class="card statusbar">
        <div class="timeline" id="timeline" role="group" aria-label="Census year"></div>
        <span class="sep" aria-hidden="true"></span>
        <span class="source">Cartographic boundaries · Statistics Canada · Open Government Licence</span>
    </div>

    <aside class="card drawer" id="drawer" aria-label="Division profile" aria-live="polite" hidden></aside>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="data/census-boundaries.js"></script>
    <script src="data/census-age-sex-2016.js"></script>
    <script src="data/census-profile-2016.js"></script>
    <script src="js/format.js"></script>
    <script src="js/breaks.js"></script>
    <script src="js/metrics.js"></script>
    <script src="js/regions.js"></script>
    <script src="js/controls.js"></script>
    <script src="js/dots.js"></script>
    <script src="js/profile.js"></script>
    <script src="js/panel.js"></script>
    <script src="js/dot-layer.js"></script>
    <script src="js/map.js"></script>
    <script>CensusViewer.map.start();</script>
</body>
</html>
